<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sökfält.css">
</head>
<body>

<!--1-->
<div class="topbar">
  <div class="topbar-messages">
    <span class="topbar-msg">Javautvecklare 2025-2027</span>
    <div class="topbar-divider"></div>
    <span class="topbar-msg">Grupp6b | <a>Visa alla medlemmar</a></span>
  </div>
</div>

<!--2-->
<div class="main-nav">
  <div class="logo">BlomsterByte</div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Försök att söka efter något...">
  </div>

  <div class="nav-icons">
    <!--Konto-->
    <button class="nav-icon-btn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
    <!--Hjärta-->
    <button class="nav-icon-btn">
      <svg viewBox="0 0 24 24"><path d="M12 21C12 21 3 14.5 3 8.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 9 2.5C21 14.5 12 21 12 21z"/></svg>
    </button>
    <!--Butik-->
    <button class="nav-icon-btn">
      <svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M9 21V12h6v9"/></svg>
      <span>Välj din butik</span>
    </button>
    <!--Flagga-->
    <div class="flag">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" fill="#006AA7"/>
        <rect y="9" width="24" height="6" fill="#FECC02"/>
        <rect x="6" width="6" height="24" fill="#FECC02"/>
        <rect y="10" width="24" height="4" fill="#FECC02"/>
        <rect x="7" width="4" height="24" fill="#FECC02"/>
      </svg>
    </div>
  </div>
</div>

<!--3-->
<div class="link-nav">
  <div class="link-nav-inner" id="linkNav">
    
    <a href="#" class="active">Produkter <span class="arrow">▾</span></a>
    <a href="#">Veckans erbjudande</a>
    <a href="#">Påsk <span class="badge">Nytt</span></a>
    <a href="#">Kontakt</a>
    <a href="#">Om</a>
    <div class="highlight" id="highlight"></div>
  </div>
</div>
<script src="sökfält.js"></script>
<script>
  const nav = document.getElementById('linkNav');
  const highlight = document.getElementById('highlight');
  const links = nav.querySelectorAll('a');

  function moveHighlight(el) {
    highlight.style.left = el.offsetLeft + 'px';
    highlight.style.width = el.offsetWidth + 'px';
  }

  const active = nav.querySelector('a.active');
  if (active) moveHighlight(active);

  links.forEach(link => {
    link.addEventListener('mouseenter', () => moveHighlight(link));
    link.addEventListener('click', (e) => {
      e.preventDefault();
      links.forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      moveHighlight(link);
    });
  });

  nav.addEventListener('mouseleave', () => {
    const current = nav.querySelector('a.active');
    if (current) moveHighlight(current);
  });
</script>
</body>
</html>
